<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Comment — AI Pimp Studio</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0b0909; --surface:#111010; --border:#242020;
      --gold:#c9a55a; --gold-dim:#7a6030; --rose:#b5507a;
      --text:#ede8e0; --muted:#ffffff; --radius:6px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;font-weight:300;font-size:14px;line-height:1.6;}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");background-size:200px 200px;pointer-events:none;z-index:9999;opacity:0.6;}
    header{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;}
    .wordmark{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;letter-spacing:0.02em;color:var(--text);}
    nav{display:flex;gap:2px;}
    .nav-btn{background:none;border:none;color:var(--muted);font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;padding:6px 16px;border-radius:var(--radius);transition:color .2s,background .2s;text-decoration:none;display:inline-flex;align-items:center;}
    .nav-btn:hover{color:var(--text);}
    .nav-btn.active{color:var(--gold);background:rgba(201,165,90,0.08);}
    main{padding:32px;max-width:1600px;margin:0 auto;}
    h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:28px;margin-bottom:6px;color:var(--gold);}
    .subtitle{color:#8a8580;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:24px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
    .card h2{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;color:var(--text);margin-bottom:12px;letter-spacing:0.04em;}
    label{display:block;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8a8580;margin-bottom:6px;}
    textarea,input[type=text],input[type=password],input[type=number]{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:12px;resize:vertical;}
    textarea:focus,input:focus{outline:none;border-color:var(--gold-dim);}
    .row{display:flex;gap:16px;}
    .row > div{flex:1;}
    button.primary{background:var(--gold);color:#0b0909;border:none;padding:10px 24px;font-family:'Jost',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;border-radius:var(--radius);cursor:pointer;transition:background .2s;}
    button.primary:hover{background:#d6b46a;}
    button.primary:disabled{background:#3a3330;color:#6a6360;cursor:not-allowed;}
    button.secondary{background:transparent;color:var(--text);border:1px solid var(--border);padding:8px 18px;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;border-radius:var(--radius);cursor:pointer;}
    button.secondary:hover{border-color:var(--gold-dim);}
    .select-lists{display:flex;gap:20px;}
    .select-list{flex:1;min-width:0;}
    .select-list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .select-list-header label{margin:0;}
    .select-all-btn{background:none;border:none;color:var(--gold-dim);font-family:'Jost',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;padding:2px 6px;}
    .select-all-btn:hover{color:var(--gold);}
    .pill-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px;display:flex;flex-wrap:wrap;gap:8px;min-height:48px;max-height:220px;overflow-y:auto;}
    .sel-pill{padding:7px 14px;border-radius:20px;font-size:12px;font-family:'Jost',sans-serif;font-weight:400;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:var(--bg);color:#8a8580;user-select:none;white-space:nowrap;}
    .sel-pill.on{background:rgba(201,165,90,0.15);border-color:var(--gold-dim);color:var(--gold);}
    .sel-pill:hover{border-color:var(--gold-dim);}
    .sel-pill .remove-x{margin-left:6px;color:#6a5555;font-weight:600;}
    .sel-pill .remove-x:hover{color:var(--rose);}
    .add-row{display:flex;gap:8px;margin-top:12px;align-items:center;}
    .add-row input{max-width:280px;}
    .add-model-row{flex-wrap:wrap;}
    .add-model-row input{flex:1;min-width:140px;max-width:none;}
    .add-model-row button{flex-shrink:0;}
    .form-error{color:var(--rose);font-size:12px;margin-top:8px;min-height:1em;}
    .customize-toggle{background:none;border:none;color:var(--gold-dim);font-family:'Jost',sans-serif;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;padding:8px 0;margin-top:12px;display:flex;align-items:center;gap:6px;}
    .customize-toggle:hover{color:var(--gold);}
    .customize-toggle .arrow{transition:transform .2s;display:inline-block;}
    .customize-toggle .arrow.open{transform:rotate(90deg);}
    .customize-panel{display:none;margin-top:12px;}
    .customize-panel.open{display:block;}
    .accordion-item{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;overflow:hidden;}
    .accordion-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;background:var(--bg);transition:background .2s;}
    .accordion-header:hover{background:rgba(201,165,90,0.04);}
    .accordion-header .name{font-size:13px;font-weight:400;}
    .accordion-header .count{font-size:11px;color:#8a8580;}
    .accordion-header .arrow{color:#8a8580;transition:transform .2s;display:inline-block;font-size:12px;}
    .accordion-header .arrow.open{transform:rotate(90deg);}
    .accordion-body{display:none;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface);}
    .accordion-body.open{display:flex;flex-wrap:wrap;gap:6px;}
    .status-panel{font-family:'JetBrains Mono',monospace;font-size:12px;background:#000;border:1px solid var(--border);border-radius:var(--radius);padding:14px;max-height:300px;overflow:auto;white-space:pre-wrap;color:#b5b0a8;}
    .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;}
    .hint{color:#6a6560;font-size:11px;margin-top:6px;}
    .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;}
    .pill.idle{background:#2a2520;color:#8a8580;}
    .pill.running{background:rgba(201,165,90,0.15);color:var(--gold);}
    .pill.done{background:rgba(120,180,120,0.15);color:#78b478;}
    .pill.error{background:rgba(181,80,122,0.15);color:var(--rose);}

    /* hamburger */
    .hamburger{display:none;background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;padding:4px 8px;}


    /* ── Mobile ── */
    @media(max-width:768px){
      header{padding:0 16px;height:50px;}
      .wordmark{font-size:18px;}
      .hamburger{display:block;}
      nav{display:none;position:absolute;top:50px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--border);flex-direction:column;padding:8px 0;z-index:200;}
      nav.open{display:flex;}
      .nav-btn{padding:12px 24px;font-size:12px;width:100%;text-align:left;border-radius:0;}
      main{padding:16px;}
      h1{font-size:22px;}
      .subtitle{font-size:11px;margin-bottom:16px;}
      .card{padding:14px;}
      .card h2{font-size:16px;}
      .row{flex-direction:column;gap:12px;}
      .bar{flex-direction:column;align-items:stretch;gap:10px;}
      .bar > div{display:flex;flex-wrap:wrap;gap:8px;}
      button.primary,button.secondary{padding:12px 20px;font-size:12px;flex:1;min-width:0;}
      textarea{font-size:14px;rows:4;}
      input[type=text],input[type=password],input[type=number]{font-size:14px;padding:12px;}
      .select-lists{flex-direction:column;gap:14px;}
      .sel-pill{padding:10px 16px;font-size:13px;}
      .add-row{flex-direction:column;}
      .add-row input{max-width:100%;}
      .add-row button{width:100%;}
      .status-panel{font-size:11px;padding:10px;max-height:200px;}
      .hint{font-size:10px;}
    }
  </style>
</head>
<body>
  <header>
    <div class="wordmark">AI Pimp Studio</div>
    <button class="hamburger" onclick="document.querySelector('nav').classList.toggle('open')">&#9776;</button>
    <nav>
      <a class="nav-btn" href="/">Generate</a>
      <a class="nav-btn" href="/#dashboard">Dashboard</a>
      <a class="nav-btn active" href="/auto-comment">Auto-Comment</a>
      <a class="nav-btn" href="/logout">Sign out</a>
    </nav>
  </header>

  <main>
    <h1>Auto-Comment</h1>
    <div class="subtitle">Cycle each girl through her checked target accounts and drop a comment on the most recent non-pinned post.</div>

    <div class="card">
      <h2>Comment bank</h2>
      <label>One comment per line — random draw, no immediate repeats</label>
      <textarea id="comments" rows="6" placeholder="Wow, bravo&#10;obsessed&#10;stunning"></textarea>
    </div>

    <div class="card">
      <h2>Select Models & Targets</h2>
      <div class="select-lists">
        <div class="select-list">
          <div class="select-list-header">
            <label>Models</label>
            <button class="select-all-btn" onclick="toggleAllModels()">Select all</button>
          </div>
          <div class="pill-box" id="model-pills"></div>
          <div class="add-row add-model-row">
            <input type="text" id="new-model-name" placeholder="account name (optional — defaults to username)">
            <input type="text" id="new-model-username" placeholder="Instagram username" autocapitalize="none" autocorrect="off" spellcheck="false">
            <input type="password" id="new-model-password" placeholder="Instagram password">
            <button class="secondary" onclick="addModel()">Add model</button>
          </div>
          <div id="add-model-error" class="form-error"></div>
        </div>
        <div class="select-list">
          <div class="select-list-header">
            <label>Targets</label>
            <button class="select-all-btn" onclick="toggleAllTargets()">Select all</button>
          </div>
          <div class="pill-box" id="target-pills"></div>
          <div class="add-row">
            <input type="text" id="new-target" placeholder="add target username or paste IG link">
            <button class="secondary" onclick="addTarget()">Add target</button>
          </div>
        </div>
      </div>
      <button class="customize-toggle" onclick="toggleCustomize()">
        <span class="arrow" id="cust-arrow">▸</span> Customize per-model assignments
      </button>
      <div class="customize-panel" id="customize-panel"></div>
    </div>


    <div class="card">
      <div class="bar">
        <div>
          <button class="primary" id="save-btn" onclick="save()">Save config</button>
          <button class="primary" id="run-btn" onclick="run(false)" style="margin-left:8px;">Run</button>
          <button class="secondary" onclick="run(true)" style="margin-left:8px;">Dry-run</button>
        </div>
        <span id="status-pill" class="pill idle">idle</span>
      </div>
      <div class="status-panel" id="status-panel">No runs yet.</div>
    </div>
  </main>

  <script>
    let state = { comments: [], assignments: {}, accounts: [], girls: [],
                   selectedGirls: [], selectedTargets: [],
                   delay_t: [25,70], delay_a: [60,180] };
    let personas = {};
    let pollTimer = null;
    let currentJob = null;
    let customizeOpen = false;

    function deriveSelections() {
      state.selectedGirls = state.girls.filter(g =>
        (state.assignments[g] || []).length > 0);
      state.selectedTargets = [...new Set(
        Object.values(state.assignments).flat()
      )].filter(t => state.accounts.includes(t));
    }

    function syncAssignments() {
      for (const g of state.girls) {
        if (!state.selectedGirls.includes(g)) {
          state.assignments[g] = [];
        } else if (!customizeOpen) {
          state.assignments[g] = state.selectedTargets.slice();
        } else {
          state.assignments[g] = (state.assignments[g] || []).filter(t => state.selectedTargets.includes(t));
        }
      }
    }

    async function load() {
      const [cfg, p, creds] = await Promise.all([
        fetch('/api/auto-comment/config').then(r=>r.json()),
        fetch('/api/personas').then(r=>r.json()),
        fetch('/api/web-credentials').then(r=>r.json()),
      ]);
      personas = p;
      state.girls = (creds.names || []).slice().sort();
      state.comments = cfg.comments || [];
      state.assignments = cfg.assignments || {};
      state.accounts = (cfg.accounts || []).slice();
      state.delay_t = cfg.delay_between_targets_s || [25,70];
      state.delay_a = cfg.delay_between_accounts_s || [60,180];
      document.getElementById('comments').value = state.comments.join('\n');
      for (const g of state.girls) if (!state.assignments[g]) state.assignments[g] = [];
      deriveSelections();
      render();
    }

    function displayName(g) {
      return (personas[g] && personas[g].display_name) || g.replace(/_/g, ' ');
    }

    function render() {
      renderModelPills();
      renderTargetPills();
      renderCustomize();
    }

    function renderModelPills() {
      const box = document.getElementById('model-pills');
      box.innerHTML = state.girls.map(g => {
        const on = state.selectedGirls.includes(g);
        return `<span class="sel-pill${on?' on':''}" onclick="toggleModel('${g}')">${displayName(g)}</span>`;
      }).join('');
    }

    function renderTargetPills() {
      const box = document.getElementById('target-pills');
      if (state.accounts.length === 0) {
        box.innerHTML = '<span style="color:#6a6560;font-size:12px;padding:4px;">No targets yet — add one below.</span>';
        return;
      }
      box.innerHTML = state.accounts.map(t => {
        const on = state.selectedTargets.includes(t);
        return `<span class="sel-pill${on?' on':''}" onclick="toggleTarget('${t}')">${t}<span class="remove-x" onclick="event.stopPropagation();removeTarget('${t}')">×</span></span>`;
      }).join('');
    }

    function toggleModel(g) {
      const i = state.selectedGirls.indexOf(g);
      if (i >= 0) state.selectedGirls.splice(i, 1);
      else state.selectedGirls.push(g);
      syncAssignments();
      render();
    }

    function toggleTarget(t) {
      const i = state.selectedTargets.indexOf(t);
      if (i >= 0) state.selectedTargets.splice(i, 1);
      else state.selectedTargets.push(t);
      syncAssignments();
      render();
    }

    function toggleAllModels() {
      if (state.selectedGirls.length === state.girls.length) {
        state.selectedGirls = [];
      } else {
        state.selectedGirls = state.girls.slice();
      }
      syncAssignments();
      render();
    }

    function toggleAllTargets() {
      if (state.selectedTargets.length === state.accounts.length) {
        state.selectedTargets = [];
      } else {
        state.selectedTargets = state.accounts.slice();
      }
      syncAssignments();
      render();
    }

    function addTarget() {
      const inp = document.getElementById('new-target');
      let v = (inp.value || '').trim();
      const m = v.match(/instagram\.com\/([^/?#]+)/i);
      if (m) v = m[1];
      v = v.replace(/^@/, '');
      inp.value = '';
      if (!v || state.accounts.includes(v)) return;
      state.accounts.push(v);
      state.selectedTargets.push(v);
      syncAssignments();
      render();
    }

    async function addModel() {
      const nameInp = document.getElementById('new-model-name');
      const userInp = document.getElementById('new-model-username');
      const passInp = document.getElementById('new-model-password');
      const errEl = document.getElementById('add-model-error');
      const username = (userInp.value || '').trim().replace(/^@/, '');
      let name = (nameInp.value || '').trim().toLowerCase().replace(/\s+/g, '_');
      if (!name) name = username.toLowerCase().replace(/[^a-z0-9_]/g, '_');
      const password = passInp.value || '';
      errEl.textContent = '';
      if (!username || !password) {
        errEl.textContent = 'Username and password are required.';
        return;
      }
      const r = await fetch('/api/web-credentials', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({name, username, password}),
      });
      const data = await r.json();
      if (!data.ok) {
        errEl.textContent = data.error || 'Failed to add model';
        return;
      }
      nameInp.value = ''; userInp.value = ''; passInp.value = '';
      const creds = await fetch('/api/web-credentials').then(r=>r.json());
      state.girls = (creds.names || []).slice().sort();
      for (const g of state.girls) if (!state.assignments[g]) state.assignments[g] = [];
      render();
    }

    function removeTarget(t) {
      state.accounts = state.accounts.filter(x => x !== t);
      state.selectedTargets = state.selectedTargets.filter(x => x !== t);
      for (const g of Object.keys(state.assignments)) {
        state.assignments[g] = (state.assignments[g] || []).filter(x => x !== t);
      }
      render();
    }

    function toggleCustomize() {
      customizeOpen = !customizeOpen;
      document.getElementById('cust-arrow').classList.toggle('open', customizeOpen);
      document.getElementById('customize-panel').classList.toggle('open', customizeOpen);
      if (customizeOpen) renderCustomize();
    }

    function renderCustomize() {
      const panel = document.getElementById('customize-panel');
      if (!customizeOpen) return;
      const active = state.selectedGirls;
      if (active.length === 0) {
        panel.innerHTML = '<div style="color:#6a6560;font-size:12px;padding:8px 0;">Select at least one model above.</div>';
        return;
      }
      panel.innerHTML = active.map(g => {
        const assigned = state.assignments[g] || [];
        const open = panel.querySelector(`[data-acc-g="${g}"] .accordion-body.open`) ? true : false;
        return `<div class="accordion-item" data-acc-g="${g}">
          <div class="accordion-header" onclick="toggleAccordion(this)">
            <span class="name">${displayName(g)}</span>
            <span>
              <span class="count">${assigned.length} / ${state.selectedTargets.length} targets</span>
              <span class="arrow${open?' open':''}"> ▸</span>
            </span>
          </div>
          <div class="accordion-body">
            ${state.selectedTargets.length === 0
              ? '<span style="color:#6a6560;font-size:12px;">No targets selected.</span>'
              : state.selectedTargets.map(t => {
                const on = assigned.includes(t);
                return `<span class="sel-pill${on?' on':''}" onclick="toggleCustomAssignment('${g}','${t}')">${t}</span>`;
              }).join('')}
          </div>
        </div>`;
      }).join('');
    }

    function toggleAccordion(header) {
      const body = header.nextElementSibling;
      const arrow = header.querySelector('.arrow');
      body.classList.toggle('open');
      arrow.classList.toggle('open');
    }

    function toggleCustomAssignment(g, t) {
      const list = state.assignments[g] || (state.assignments[g] = []);
      const i = list.indexOf(t);
      if (i >= 0) list.splice(i, 1);
      else list.push(t);
      renderCustomize();
    }

    function collect() {
      const comments = document.getElementById('comments').value
        .split('\n').map(s => s.trim()).filter(Boolean);
      return {
        comments,
        accounts: state.accounts,
        assignments: state.assignments,
        delay_between_targets_s: state.delay_t,
        delay_between_accounts_s: state.delay_a,
      };
    }

    async function save() {
      const body = collect();
      const r = await fetch('/api/auto-comment/config', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body),
      });
      const j = await r.json();
      setStatus(j.ok ? 'Config saved.' : ('Save failed: ' + j.error), j.ok ? 'idle' : 'error');
    }

    async function run(dry) {
      await save();
      const r = await fetch('/api/auto-comment/run', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ dry_run: dry }),
      });
      const j = await r.json();
      if (!j.ok) { setStatus('Run failed: ' + j.error, 'error'); return; }
      currentJob = j.job_id;
      setPill('running');
      poll();
    }

    function setPill(kind) {
      const p = document.getElementById('status-pill');
      p.className = 'pill ' + kind;
      p.textContent = kind;
    }

    function setStatus(text, kind) {
      const panel = document.getElementById('status-panel');
      panel.textContent = text;
      if (kind) setPill(kind);
    }

    async function poll() {
      if (!currentJob) return;
      clearTimeout(pollTimer);
      const r = await fetch('/api/auto-comment/job/' + currentJob);
      if (!r.ok) { setStatus('Job not found', 'error'); return; }
      const j = await r.json();
      const lines = [];
      lines.push(`status: ${j.status}`);
      if (j.error) lines.push(`error: ${j.error}`);
      if (j.results && j.results.length) {
        lines.push('');
        for (const row of j.results) {
          lines.push(`[${row.account}] ${row.succeeded}/${row.attempted} ok` +
            (row.failed && row.failed.length ? `, ${row.failed.length} failed` : ''));
          for (const f of (row.failed || [])) {
            lines.push(`  ✗ ${f.target}: ${f.reason}`);
          }
        }
      }
      if (j.log && j.log.length) {
        lines.push('');
        lines.push('--- log ---');
        lines.push(...j.log.slice(-80));
      }
      document.getElementById('status-panel').textContent = lines.join('\n');
      if (j.status === 'done') setPill('done');
      else if (j.status === 'error') setPill('error');
      else { pollTimer = setTimeout(poll, 1500); return; }
    }

    load();
  </script>
</body>
</html>
