<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — AI Pimp Studio</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0b0909;
      --surface: #111010;
      --border: #242020;
      --gold: #c9a55a;
      --gold-dim: #7a6030;
      --text: #ede8e0;
      --muted: #8a847b;
      --rose: #b5507a;
      --radius: 6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.6;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 28px;
    }

    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-style: italic;
      font-size: 26px;
      color: var(--gold);
      text-align: center;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 10px 12px;
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: var(--gold-dim);
    }

    .field + .field {
      margin-top: 14px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      background: var(--gold);
      color: #0b0909;
      border: none;
      padding: 11px 14px;
      font-family: inherit;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover { background: #d6b46a; }

    .error {
      margin-top: 14px;
      color: var(--rose);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <form class="card" method="POST" autocomplete="off">
      <div class="brand">AI Pimp Studio</div>
      <div class="subtitle">Restricted Access</div>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Enter</button>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
  </div>
</body>

</html>
