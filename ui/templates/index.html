<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Pimp Studio</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0b0909;
      --surface: #111010;
      --border: #242020;
      --gold: #c9a55a;
      --gold-dim: #7a6030;
      --rose: #b5507a;
      --text: #ede8e0;
      --muted: #ffffff;
      --radius: 6px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Film grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.6;
    }

    /* Layout */
    .shell {
      display: grid;
      grid-template-rows: 56px 1fr;
      min-height: 100vh;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .wordmark span {
      font-weight: 300;
      font-style: italic;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.2em;
      margin-left: 10px;
    }

    nav {
      display: flex;
      gap: 2px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 6px 16px;
      border-radius: var(--radius);
      transition: color 0.2s, background 0.2s;
    }

    .nav-btn:hover {
      color: var(--text);
    }

    .nav-btn.active {
      color: var(--gold);
      background: rgba(201, 165, 90, 0.08);
    }

    /* Pages */
    .page {
      display: none;
      padding: 32px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .page.active {
      display: block;
    }

    /* Section label */
    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* Model grid */
    .model-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .model-card {
      position: relative;
      aspect-ratio: 3/4;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.2s;
      background: var(--surface);
    }

    .model-card:hover {
      transform: translateY(-2px);
    }

    .model-card.selected {
      border-color: var(--gold);
    }

    .model-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.8) saturate(0.9);
      transition: filter 0.3s;
    }

    .model-card:hover img,
    .model-card.selected img {
      filter: brightness(0.9) saturate(1);
    }

    .model-card-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 10px 10px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-weight: 400;
      color: #fff;
      letter-spacing: 0.05em;
    }

    .model-card.selected .model-card-label::after {
      content: '';
      display: block;
      width: 20px;
      height: 2px;
      background: var(--gold);
      margin-top: 4px;
    }

    /* Controls row */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      padding: 20px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .type-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg);
      padding: 3px;
      border-radius: var(--radius);
    }

    .type-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 6px 16px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .type-btn.active {
      background: var(--gold);
      color: var(--bg);
    }

    .divider {
      width: 1px;
      height: 28px;
      background: var(--border);
      margin: 0 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--bg);
    }

    .btn-primary:hover:not(:disabled) {
      background: #d9b56a;
    }

    .btn-ghost {
      background: none;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--muted);
    }

    .btn-rose {
      background: var(--rose);
      color: #fff;
    }

    .btn-rose:hover:not(:disabled) {
      background: #c56085;
    }

    .btn-post {
      background: var(--rose);
      color: #fff;
    }

    .btn-post:hover:not(:disabled) {
      background: #c56085;
    }

    .btn-dark {
      background: #1a1a1a;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-dark:hover:not(:disabled) {
      background: #222;
      color: var(--text);
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 10px;
    }

    .ml-auto {
      margin-left: auto;
    }

    /* Result cards */
    #results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: start;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .result-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .result-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 400;
    }

    .result-type {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--gold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-left: 6px;
    }

    .result-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .result-body {
      display: flex;
      flex-direction: column;
    }

    .result-prompts {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .result-preview {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .prompt-block {
      margin-bottom: 16px;
    }

    .prompt-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--gold-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .prompt-text {
      font-size: 13px;
      color: #ffffff;
      line-height: 1.75;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .caption-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-style: italic;
      color: var(--text);
    }

    /* Preview area */
    .preview-placeholder {
      flex: 1;
      min-height: 200px;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
    }

    .preview-placeholder .icon {
      font-size: 28px;
      opacity: 0.4;
    }

    .preview-placeholder .hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .preview-img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: var(--radius);
      display: block;
    }

    .preview-video {
      width: 100%;
      border-radius: var(--radius);
      background: #000;
      max-height: 400px;
    }

    /* Progress */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(201, 165, 90, 0.06);
      border-radius: var(--radius);
      border: 1px solid rgba(201, 165, 90, 0.15);
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .progress-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 0.05em;
    }

    /* Status badge */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 100px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .badge-success {
      background: rgba(80, 180, 120, 0.15);
      color: #60c080;
    }

    .badge-error {
      background: rgba(200, 80, 80, 0.15);
      color: #e07070;
    }

    .badge-pending {
      background: rgba(201, 165, 90, 0.1);
      color: var(--gold);
    }

    /* ── Dashboard ──────────────────────────────────────────────────── */

    .dash-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }

    .dash-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 10px 20px;
      color: var(--muted);
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dash-tab:hover {
      color: var(--text);
    }

    .dash-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    .dash-tab img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0.7;
    }

    .dash-tab.active img {
      opacity: 1;
    }

    .dash-panel {
      display: none;
    }

    .dash-panel.active {
      display: block;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      padding: 20px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .stat-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px;
      font-weight: 300;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }

    .post-thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 4px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .post-thumb:hover {
      transform: scale(1.03);
      border-color: var(--gold);
    }

    .post-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .post-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .post-thumb:hover .post-overlay {
      opacity: 1;
    }

    .post-stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 3px;
      font-weight: 400;
    }

    /* ── Post modal ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: grid;
      grid-template-columns: 1fr 360px;
      max-height: 90vh;
      width: 100%;
      max-width: 900px;
      overflow: hidden;
    }

    .modal-media {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .modal-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .modal-side {
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-caption {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-style: italic;
      line-height: 1.5;
      color: var(--text);
      flex: 1;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-stats {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 20px;
    }

    .modal-stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .modal-stat strong {
      color: var(--text);
      font-weight: 400;
    }

    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .comment {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .comment-user {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--gold);
      letter-spacing: 0.05em;
    }

    .comment-text {
      font-size: 13px;
      color: #ffffff;
      line-height: 1.5;
    }

    .comment-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .reply-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .reply-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px;
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .reply-input:focus {
      border-color: var(--gold);
    }

    .reply-input::placeholder {
      color: var(--muted);
    }

    .reply-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 10px;
      font-size: 14px;
      transition: color 0.2s, border-color 0.2s;
    }

    .reply-btn:hover {
      color: var(--gold);
      border-color: var(--gold);
    }

    .reply-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      margin-top: 3px;
      min-height: 14px;
    }

    .comments-loading {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 20px 0;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .dm-section {
      margin-top: 32px;
    }

    .dm-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    .dm-thread {
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .dm-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .dm-from {
      font-family: 'Jost', sans-serif;
      font-weight: 500;
      font-size: 13px;
      color: var(--text);
    }

    .dm-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .dm-messages {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dm-msg {
      font-size: 13px;
      color: #ffffff;
      padding: 6px 10px;
      background: var(--bg);
      border-radius: 4px;
      line-height: 1.5;
    }

    .dm-msg .dm-sender {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--gold-dim);
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .dash-empty {
      padding: 60px 0;
      text-align: center;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .dash-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 40px 0;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    /* Misc */
    .error-msg {
      padding: 12px 16px;
      background: rgba(200, 80, 80, 0.1);
      border: 1px solid rgba(200, 80, 80, 0.25);
      border-radius: var(--radius);
      color: #e07070;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }
  </style>
</head>

<body>
  <div class="shell">

    <header>
      <div class="wordmark">AI Pimp Studio</div>
      <nav>
        <button class="nav-btn active" onclick="showPage('generator', this)">Generate</button>
        <button class="nav-btn" onclick="showPage('dashboard', this)">Dashboard</button>
        <a class="nav-btn" href="/auto-comment" style="text-decoration:none;display:inline-flex;align-items:center;">Auto-Comment</a>
      </nav>
    </header>

    <!-- ── Generator page ─────────────────────────────────────────── -->
    <div id="page-generator" class="page active">

      <div class="label">Select models</div>
      <div class="model-grid" id="model-grid">
        <!-- Populated by JS -->
      </div>

      <div class="controls">
        <div class="label" style="margin:0">Format</div>
        <div class="type-toggle">
          <button class="type-btn active" id="btn-photo" onclick="selectType('photo')">Photo</button>
          <button class="type-btn" id="btn-reel" onclick="selectType('reel')">Reel</button>
        </div>
        <div class="divider"></div>
        <button class="btn btn-primary" onclick="generateAll()" id="btn-generate">
          Generate Prompts
        </button>
        <button class="btn btn-rose" onclick="createAll()" id="btn-create-all">
          Create All
        </button>
        <button class="btn btn-post" onclick="postAll()" id="btn-post-all">
          Post All
        </button>
        <button class="btn btn-dark" onclick="clearHistory()">
          Clear History
        </button>
      </div>

      <div id="results"></div>

    </div>

    <!-- ── Dashboard page ─────────────────────────────────────────── -->
    <div id="page-dashboard" class="page">
      <div id="dash-tabs" class="dash-tabs"></div>
      <div id="dash-content"></div>
    </div>

  </div>

  <!-- Post modal -->
  <div class="modal-backdrop" id="post-modal" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-media" id="modal-media"></div>
      <div class="modal-side">
        <div class="modal-header">
          <div class="modal-caption" id="modal-caption"></div>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-stats" id="modal-stats"></div>
        <div class="comments-list" id="comments-list"></div>
      </div>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let personas = {};
    let selectedModels = new Set();
    let selectedType = 'photo';
    let resultCards = {};
    let postCache = {};       // post_id -> post object
    let activeDashAccount = null;

    // ── Init ───────────────────────────────────────────────────────────────────
    async function init() {
      const resp = await fetch('/api/personas');
      personas = await resp.json();
      renderModelGrid();
    }

    function renderModelGrid() {
      const grid = document.getElementById('model-grid');
      grid.innerHTML = '';
      for (const [key, p] of Object.entries(personas)) {
        selectedModels.add(key);
        const card = document.createElement('div');
        card.className = 'model-card selected';
        card.dataset.key = key;
        card.onclick = () => toggleModel(key, card);
        card.innerHTML = `
      <img src="/media/headshot/${key}" alt="${p.display_name}"
           onerror="this.style.display='none'">
      <div class="model-card-label">${p.display_name}</div>
    `;
        grid.appendChild(card);
      }
    }

    function toggleModel(key, card) {
      if (selectedModels.has(key)) {
        selectedModels.delete(key);
        card.classList.remove('selected');
        const resultCard = document.getElementById('card-' + key);
        if (resultCard) resultCard.remove();
      } else {
        selectedModels.add(key);
        card.classList.add('selected');
      }
    }

    function selectType(type) {
      selectedType = type;
      document.getElementById('btn-photo').classList.toggle('active', type === 'photo');
      document.getElementById('btn-reel').classList.toggle('active', type === 'reel');
    }

    function showPage(page, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      btn.classList.add('active');
      if (page === 'dashboard') loadDashboard();
    }

    // ── Generator ──────────────────────────────────────────────────────────────
    async function generateAll() {
      if (selectedModels.size === 0) {
        alert('Select at least one model.');
        return;
      }

      const btn = document.getElementById('btn-generate');
      btn.disabled = true;
      btn.textContent = 'Generating…';

      const results = document.getElementById('results');

      for (const key of selectedModels) {
        // Create or reset card
        let card = document.getElementById('card-' + key);
        if (!card) {
          card = document.createElement('div');
          card.id = 'card-' + key;
          card.className = 'result-card';
          results.prepend(card);
        }

        renderCardLoading(card, key);
        fetchPrompts(key, card);
      }

      btn.disabled = false;
      btn.textContent = 'Generate Prompts';
    }

    async function fetchPrompts(key, card) {
      renderCardLoading(card, key);
      try {
        const resp = await fetch('/api/generate-prompts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ persona: key, post_type: selectedType }),
        });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error);
        renderCardPrompts(card, key, data.prompts, selectedType);
      } catch (e) {
        card.innerHTML = `
      <div class="result-header">
        <img class="result-avatar" src="/media/headshot/${key}" onerror="this.style.display='none'">
        <span class="result-name">${personas[key]?.display_name || key}</span>
        <div class="result-actions">
          <button class="btn btn-ghost btn-sm" onclick="reroll('${key}')">Re-roll</button>
        </div>
      </div>
      <div style="padding:20px">
        <div class="error-msg">${e.message}</div>
      </div>`;
      }
    }

    function renderCardLoading(card, key) {
      const p = personas[key] || {};
      card.innerHTML = `
    <div class="result-header">
      <img class="result-avatar" src="/media/headshot/${key}" onerror="this.style.display='none'">
      <span class="result-name">${p.display_name || key}</span>
      <span class="result-type">${selectedType}</span>
    </div>
    <div style="padding:20px">
      <div class="progress-row">
        <div class="spinner"></div>
        <span class="progress-text">Generating prompts…</span>
      </div>
    </div>`;
    }

    function renderCardPrompts(card, key, prompts, type) {
      const p = personas[key] || {};
      const hasVideo = type === 'reel' && prompts.video_prompt;

      card.innerHTML = `
    <div class="result-header">
      <img class="result-avatar" src="/media/headshot/${key}" onerror="this.style.display='none'">
      <span class="result-name">${p.display_name || key}</span>
      <span class="result-type">${type}</span>
      <div class="result-actions">
        <button class="btn btn-ghost btn-sm" onclick="reroll('${key}')">Re-roll</button>
        <button class="btn btn-primary btn-sm" onclick="createContent('${key}', this)" id="create-${key}">Create Content</button>
      </div>
    </div>
    <div class="result-body">
      <div class="result-prompts">
        <div class="prompt-block">
          <div class="prompt-label">Scene Prompt</div>
          <div class="prompt-text">${escHtml(prompts.scene_prompt)}</div>
        </div>
        ${hasVideo ? `
        <div class="prompt-block">
          <div class="prompt-label">Video Prompt</div>
          <div class="prompt-text">${escHtml(prompts.video_prompt)}</div>
        </div>` : ''}
        <div class="prompt-block">
          <div class="prompt-label">Caption</div>
          <div class="caption-text">${escHtml(prompts.caption)}</div>
        </div>
      </div>
      <div class="result-preview" id="preview-${key}">
        <div class="preview-placeholder">
          <div class="icon">${type === 'reel' ? '▶' : '◻'}</div>
          <div class="hint">Click "Create Content" to generate</div>
        </div>
      </div>
    </div>`;

      // Attach prompts to card for later use
      card.dataset.prompts = JSON.stringify(prompts);
      card.dataset.type = type;
    }

    async function reroll(key) {
      const card = document.getElementById('card-' + key);
      fetchPrompts(key, card);
    }

    async function createContent(key, btn) {
      const card = document.getElementById('card-' + key);
      const prompts = JSON.parse(card.dataset.prompts);
      const type = card.dataset.type;

      btn.disabled = true;

      const preview = document.getElementById('preview-' + key);
      preview.innerHTML = `
    <div class="progress-row">
      <div class="spinner"></div>
      <span class="progress-text" id="progress-text-${key}">Generating image…</span>
    </div>`;

      try {
        const resp = await fetch('/api/generate-content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ persona: key, post_type: type, prompts }),
        });
        const { job_id } = await resp.json();
        pollJob(job_id, key, type, preview, btn);
      } catch (e) {
        preview.innerHTML = `<div class="error-msg">${e.message}</div>`;
        btn.disabled = false;
      }
    }

    function pollJob(job_id, key, type, preview, createBtn) {
      const statusLabels = {
        starting: 'Starting…',
        editing_image: 'Generating image…',
        generating_video: 'Generating video…',
        ready: 'Done',
        error: 'Error',
      };

      const interval = setInterval(async () => {
        const resp = await fetch('/api/job/' + job_id);
        const job = await resp.json();

        const txt = document.getElementById('progress-text-' + key);
        if (txt) txt.textContent = statusLabels[job.status] || job.status;

        if (job.status === 'ready') {
          clearInterval(interval);
          renderPreviewReady(preview, key, job, type);
          createBtn.disabled = false;
        } else if (job.status === 'error') {
          clearInterval(interval);
          preview.innerHTML = `<div class="error-msg">${job.error}</div>`;
          createBtn.disabled = false;
        }
      }, 3000);
    }

    function renderPreviewReady(preview, key, job, type) {
      const media = type === 'reel'
        ? `<video class="preview-video" src="${job.media_preview}" controls playsinline muted></video>`
        : `<img class="preview-img" src="${job.edited_image}">`;

      preview.innerHTML = `
    ${media}
    <div id="post-status-${job.id}"></div>
    <button class="btn btn-post" data-job-id="${job.id}" data-key="${key}" onclick="postToIG('${job.id}', '${key}', this)">
      Post to Instagram
    </button>`;
    }

    async function postToIG(job_id, key, btn) {
      btn.disabled = true;
      btn.textContent = 'Posting…';

      const statusEl = document.getElementById('post-status-' + job_id);

      try {
        await fetch('/api/post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ job_id }),
        });

        const interval = setInterval(async () => {
          const resp = await fetch('/api/job/' + job_id);
          const job = await resp.json();

          if (job.post_status === 'posted') {
            clearInterval(interval);
            btn.textContent = 'Posted ✓';
            if (statusEl) statusEl.innerHTML = `<span class="badge badge-success">Posted — ID ${job.media_id}</span>`;
          } else if (job.post_status === 'error') {
            clearInterval(interval);
            btn.disabled = false;
            btn.textContent = 'Post to Instagram';
            if (statusEl) statusEl.innerHTML = `<div class="error-msg">${job.post_error}</div>`;
          }
        }, 3000);
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Post to Instagram';
        if (statusEl) statusEl.innerHTML = `<div class="error-msg">${e.message}</div>`;
      }
    }

    async function createAll() {
      const createBtns = document.querySelectorAll('[id^="create-"]');
      if (createBtns.length === 0) {
        alert('No prompts generated yet. Click Generate Prompts first.');
        return;
      }
      for (const btn of createBtns) {
        if (!btn.disabled) btn.click();
      }
    }

    async function postAll() {
      const postBtns = document.querySelectorAll('.btn-post[data-job-id]');
      if (postBtns.length === 0) {
        alert('No ready posts found. Generate and create content first.');
        return;
      }
      for (const btn of postBtns) {
        const jobId = btn.dataset.jobId;
        const key = btn.dataset.key;
        if (!btn.disabled) postToIG(jobId, key, btn);
      }
    }

    // ── Dashboard ──────────────────────────────────────────────────────────────
    async function loadDashboard() {
      const tabs = document.getElementById('dash-tabs');
      const content = document.getElementById('dash-content');

      tabs.innerHTML = '';
      content.innerHTML = `<div class="dash-loading"><div class="spinner"></div> Loading accounts…</div>`;

      try {
        const resp = await fetch('/api/dashboard');
        const data = await resp.json();

        if (data.error) {
          content.innerHTML = `<div class="error-msg">${data.error}</div>`;
          return;
        }

        const keys = Object.keys(data);
        if (keys.length === 0) {
          content.innerHTML = `<div class="dash-empty">No accounts found.</div>`;
          return;
        }

        activeDashAccount = keys[0];

        // Build tabs
        tabs.innerHTML = keys.map((key, i) => {
          const d = data[key];
          const p = personas[key] || {};
          return `<button class="dash-tab ${i === 0 ? 'active' : ''}" onclick="switchDashTab('${key}', this)">
        <img src="/media/headshot/${key}" onerror="this.style.display='none'">
        ${d.display_name}
      </button>`;
        }).join('');

        // Build panels
        content.innerHTML = keys.map((key, i) => {
          const d = data[key];
          return `<div class="dash-panel ${i === 0 ? 'active' : ''}" id="panel-${key}">
        ${renderDashPanel(d)}
      </div>`;
        }).join('');

      } catch (e) {
        content.innerHTML = `<div class="error-msg">${e.message}</div>`;
      }
    }

    function renderDashPanel(d) {
      const stats = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value">${d.post_count || 0}</div>
        <div class="stat-label">Recent Posts</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${d.total_likes || 0}</div>
        <div class="stat-label">Total Likes</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${d.total_comments || 0}</div>
        <div class="stat-label">Total Comments</div>
      </div>
    </div>`;

      // DMs section
      let dmsHtml = '';
      if (d.conversations && d.conversations.length > 0) {
        const threads = d.conversations.map(conv => {
          const msgs = conv.messages?.data || [];
          const latest = msgs[0];
          const time = latest ? new Date(latest.created_time).toLocaleString() : '';
          const sender = latest?.from?.username || latest?.from?.name || 'unknown';
          const msgItems = msgs.slice(0, 3).map(m =>
            `<div class="dm-msg">
          <div class="dm-sender">${escHtml(m.from?.username || m.from?.name || '?')}</div>
          ${escHtml(m.message || '')}
        </div>`
          ).join('');
          return `<div class="dm-thread">
        <div class="dm-meta">
          <span class="dm-from">@${escHtml(sender)}</span>
          <span class="dm-time">${escHtml(time)}</span>
        </div>
        <div class="dm-messages">${msgItems}</div>
      </div>`;
        }).join('');
        dmsHtml = `<div class="dm-section">
      <div class="label">Direct Messages (${d.dm_count})</div>
      <div class="dm-list">${threads}</div>
    </div>`;
      } else {
        dmsHtml = `<div class="dm-section">
      <div class="label">Direct Messages</div>
      <div class="dash-empty" style="padding:20px 0">No messages found — may require instagram_manage_messages permission.</div>
    </div>`;
      }

      if (!d.posts || d.posts.length === 0) {
        return stats + dmsHtml + `<div class="dash-empty">No posts found.</div>`;
      }

      const grid = d.posts.map(post => {
        postCache[post.id] = post;
        const thumb = post.thumbnail_url || post.media_url || '';
        return `<div class="post-thumb" onclick="openPost('${post.id}')">
      <img src="${escHtml(thumb)}" onerror="this.src=''">
      <div class="post-overlay">
        <span class="post-stat">♥ ${post.like_count || 0}</span>
        <span class="post-stat">💬 ${post.comments_count || 0}</span>
      </div>
    </div>`;
      }).join('');

      return stats + `<div class="label">Recent Posts</div><div class="posts-grid">${grid}</div>` + dmsHtml;
    }

    function switchDashTab(key, btn) {
      document.querySelectorAll('.dash-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.dash-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + key)?.classList.add('active');
      activeDashAccount = key;
    }

    // ── Post modal ─────────────────────────────────────────────────────────────
    async function openPost(postId) {
      const post = postCache[postId];
      if (!post) return;
      const isVideo = post.media_type === 'VIDEO' || post.media_type === 'REELS';

      const mediaEl = document.getElementById('modal-media');
      const thumb = post.thumbnail_url || post.media_url;
      mediaEl.innerHTML = isVideo
        ? `<video src="${post.media_url}" poster="${thumb}" controls style="width:100%;max-height:90vh"></video>`
        : `<img src="${post.media_url || thumb}" style="width:100%;max-height:90vh;object-fit:contain">`;

      document.getElementById('modal-caption').textContent = post.caption || '(no caption)';

      const date = post.timestamp ? new Date(post.timestamp).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
      document.getElementById('modal-stats').innerHTML = `
    <span class="modal-stat">♥ <strong>${post.like_count}</strong> likes</span>
    <span class="modal-stat">💬 <strong>${post.comments_count}</strong> comments</span>
    <span class="modal-stat">${date}</span>`;

      const commentsList = document.getElementById('comments-list');
      commentsList.innerHTML = `<div class="comments-loading"><div class="spinner"></div> Loading comments…</div>`;

      document.getElementById('post-modal').classList.add('open');

      try {
        const resp = await fetch(`/api/comments/${post.id}`);
        if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
        const data = await resp.json();
        if (!data.ok || data.comments.length === 0) {
          commentsList.innerHTML = `<div style="color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;padding:10px 0">No comments yet.</div>`;
          return;
        }
        commentsList.innerHTML = data.comments.map(c => {
          const t = c.timestamp ? new Date(c.timestamp).toLocaleString() : '';
          return `<div class="comment" id="comment-${c.id}">
        <span class="comment-user">@${escHtml(c.username || 'user')}</span>
        <span class="comment-text">${escHtml(c.text || '')}</span>
        <span class="comment-time">${escHtml(t)}</span>
        <div class="reply-row">
          <input class="reply-input" placeholder="Reply…" id="reply-input-${c.id}"
            onkeydown="if(event.key==='Enter')sendReply('${c.id}',this)">
          <button class="reply-btn" onclick="sendReply('${c.id}', document.getElementById('reply-input-${c.id}'))">↩</button>
        </div>
        <div class="reply-status" id="reply-status-${c.id}"></div>
      </div>`;
        }).join('');
      } catch (e) {
        commentsList.innerHTML = `<div class="error-msg">${e.message}</div>`;
      }
    }

    async function sendReply(commentId, input) {
      const message = input.value.trim();
      if (!message) return;
      const statusEl = document.getElementById('reply-status-' + commentId);
      input.disabled = true;
      statusEl.style.color = 'var(--muted)';
      statusEl.textContent = 'Sending…';
      try {
        const resp = await fetch('/api/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comment_id: commentId, message, account: activeDashAccount }),
        });
        const data = await resp.json();
        if (data.ok) {
          input.value = '';
          statusEl.style.color = '#60c080';
          statusEl.textContent = 'Replied ✓';
          setTimeout(() => { statusEl.textContent = ''; }, 3000);
        } else {
          throw new Error(data.error);
        }
      } catch (e) {
        statusEl.style.color = '#e07070';
        statusEl.textContent = e.message;
      } finally {
        input.disabled = false;
        input.focus();
      }
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('post-modal')) return;
      document.getElementById('post-modal').classList.remove('open');
      document.getElementById('modal-media').innerHTML = '';
    }

    // ── Clear History ─────────────────────────────────────────────────────────
    async function clearHistory() {
      if (!confirm('Clear prompt history for all personas?')) return;
      try {
        const res = await fetch('/api/clear-history', { method: 'POST' });
        const data = await res.json();
        if (data.ok) alert('History cleared.');
        else alert('Error: ' + data.error);
      } catch (e) { alert('Error: ' + e.message); }
    }

    // ── Util ───────────────────────────────────────────────────────────────────
    function escHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>

</html>
